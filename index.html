                options: [
                    { text: "专属定制的祝福，还提到你们的小事", score: "both_way" },
                    { text: "卡点发祝福，文案是特意写的", score: "secret_crush" },
                    { text: "复制粘贴的通用祝福", score: "polite" },
                    { text: "从来不发节日祝福", score: "pure_friend" }
                ]
            },
            {
                question: "你说过的小事，TA会记得吗？",
                options: [
                    { text: "都记得，连你随口说的喜好都记着", score: "both_way" },
                    { text: "记得一部分，重要的事不会忘", score: "slow_warm" },
                    { text: "转头就忘，主打一个左耳进右耳出", score: "signal_mismatch" },
                    { text: "会跟你打太极，不主动也不拒绝", score: "ambiguous" }
                ]
            },
            {
                question: "你感冒不舒服，TA的反应是？",
                options: [
                    { text: "直接给你送药送吃的到楼下", score: "both_way" },
                    { text: "嘴上说多喝热水，转头给你点外卖", score: "pretend_calm" },
                    { text: "会提醒你吃药休息", score: "polite" },
                    { text: "说句保重，然后就没下文了", score: "pure_friend" }
                ]
            },
            {
                question: "你开玩笑说给TA介绍对象，TA的反应是？",
                options: [
                    { text: "立马拒绝，说自己有喜欢的人了", score: "secret_crush" },
                    { text: "说不用，现在还不想谈恋爱", score: "not_time" },
                    { text: "说好啊，要跟你差不多的就行", score: "ambiguous" },
                    { text: "很开心，让你多介绍几个", score: "pure_friend" }
                ]
            },
            {
                question: "你们有没有专属的梗或者外号？",
                options: [
                    { text: "有很多，只有你们俩懂的那种", score: "both_way" },
                    { text: "有一两个，偶尔会拿来开玩笑", score: "more_than_friend" },
                    { text: "没有，都是正常称呼", score: "polite" },
                    { text: "你起了外号，但TA没接茬", score: "signal_mismatch" }
                ]
            },
            {
                question: "下雨天共撑一把伞，TA会往你这边偏吗？",
                options: [
                    { text: "大半伞都在你这边，自己肩膀湿了", score: "secret_crush" },
                    { text: "尽量不淋到你，但也不会太刻意", score: "slow_warm" },
                    { text: "举中间，俩人各占一半", score: "more_than_friend" },
                    { text: "自己顾自己，谁也别淋着谁", score: "pure_friend" }
                ]
            }
        ];

        let currentQuestion = 0;
        let scores = {
            both_way: 0,
            secret_crush: 0,
            more_than_friend: 0,
            slow_warm: 0,
            pretend_calm: 0,
            pure_friend: 0,
            ambiguous: 0,
            polite: 0,
            signal_mismatch: 0,
            not_time: 0
        };

        const landingEl = document.getElementById('landing');
        const quizEl = document.getElementById('quiz');
        const resultEl = document.getElementById('result');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const progressTextEl = document.getElementById('progress-text');
        const progressPercentEl = document.getElementById('progress-percent');
        const progressBarEl = document.getElementById('progress-bar');
        const resultTitleEl = document.getElementById('result-title');
        const resultDescEl = document.getElementById('result-desc');

        function startQuiz() {
            landingEl.classList.add('hidden');
            quizEl.classList.remove('hidden');
            quizEl.classList.add('fade-in');
            currentQuestion = 0;
            // 重置分数
            for (let key in scores) scores[key] = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            questionTextEl.textContent = q.question;
            
            // 更新进度
            const num = currentQuestion + 1;
            const total = questions.length;
            const percent = Math.round((num / total) * 100);
            progressTextEl.textContent = `第 ${num} 题 / 共 ${total} 题`;
            progressPercentEl.textContent = `${percent}%`;
            progressBarEl.style.width = `${percent}%`;

            // 渲染选项
            optionsContainerEl.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-xl border border-rose-100 bg-rose-50 hover:bg-rose-100 text-gray-700';
                btn.textContent = opt.text;
                btn.onclick = () => selectOption(opt.score);
                optionsContainerEl.appendChild(btn);
            });
        }

        function selectOption(scoreKey) {
            scores[scoreKey]++;
            
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            // 找出最高分
            let maxScore = -1;
            let maxKey = '';
            for (let key in scores) {
                if (scores[key] > maxScore) {
                    maxScore = scores[key];
                    maxKey = key;
                }
            }

            const result = resultTypes[maxKey];
            resultTitleEl.textContent = result.title;
            resultDescEl.textContent = result.desc;

            quizEl.classList.add('hidden');
            resultEl.classList.remove('hidden');
            resultEl.classList.add('fade-in');
        }

        function restartQuiz() {
            resultEl.classList.add('hidden');
            landingEl.classList.remove('hidden');
            landingEl.classList.add('fade-in');
        }
    </script>
</body>
</html>
